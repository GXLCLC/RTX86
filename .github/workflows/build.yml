# =============================================================
# RTX86 - lean LEDE x86_64 云编译工作流
# 源码: coolsnowwolf/lede master  |  目标: x86_64 Generic squashfs
# 规则: 仅手动触发 / 固定 ubuntu-24.04 / 超时 360 分钟 / 并发锁
# =============================================================

name: RTX86-LEDE-x86_64 # 工作流显示名称

# ---------- 触发规则：仅开启 workflow_dispatch 手动触发 ----------
on:
  workflow_dispatch: # 手动触发（Actions 页面点击 Run workflow）
    inputs: # 手动触发时的可选输入项
      release_note: # 自定义 Release 备注
        description: 'Release 附加备注（可留空，将追加到发布说明末尾）'
        required: false # 非必填
        default: '' # 默认空
        type: string # 输入类型为字符串

# ---------- 并发锁：同一分支自动取消正在运行的旧任务 ----------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # 按 工作流+分支 分组
  cancel-in-progress: true # 新任务启动时取消同组旧任务

# ---------- 权限：开启 GITHUB_TOKEN 写入权限，保障 Release 创建与文件上传 ----------
permissions:
  contents: write # 允许创建 Release、上传固件、写缓存

# ---------- 全局环境变量 ----------
env:
  TZ: Asia/Shanghai # 统一时区：Asia/Shanghai
  SOURCE_REPO: https://github.com/coolsnowwolf/lede # 源码仓库（固定）
  SOURCE_BRANCH: master # 源码分支（固定 master）
  SRC_DIR: lede # 源码检出目录名
  CONFIG_FILE: config/x86_64.config # 固件插件与内核配置文件路径
  OUTPUT_DIR: output # 固件产物输出目录

# ---------- 编译任务 ----------
jobs:
  build-lede: # 任务名称
    runs-on: ubuntu-24.04 # 固定运行环境 Ubuntu 24.04 LTS
    timeout-minutes: 360 # Job 级超时 360 分钟

    steps: # ==================== 步骤开始 ====================

    # ---------- 1. 检出本仓库（workflow / config / scripts） ----------
    - name: 检出编译仓库
      uses: actions/checkout@v4 # 拉取本仓库全部文件

    # ---------- 2. 清理 runner 预装大件，释放磁盘空间 ----------
    - name: 清理预装组件释放磁盘
      run: |
        # GitHub runner 预装组件占用大，删除后为编译腾出空间
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        sudo apt-get clean
        df -h / # 打印磁盘剩余空间

    # ---------- 3. 安装 Ubuntu 24.04 编译依赖 ----------
    - name: 安装编译依赖
      run: |
        sudo apt-get update
        # 注意: Ubuntu 24.04 的 python3 (3.12) 已移除 distutils，
        # 且源中无 python3-distutils 包，由 python3-setuptools 提供 distutils 兼容层
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3 python3-setuptools python3-pip python3-wheel swig unzip \
          zlib1g-dev file wget xz-utils libelf-dev cpio dosfstools f2fs-tools \
          squashfs-tools qemu-utils jq openssl
        # 兜底校验 distutils 可用性，缺失则经 pip 补装 setuptools
        if ! python3 -c "import distutils" 2>/dev/null; then
          echo "distutils 不可用，pip 补装 setuptools"
          sudo pip3 install --break-system-packages setuptools || \
            pip3 install --user setuptools
        fi
        python3 -c "import distutils; print('distutils OK')"
        echo "编译依赖安装完成"

    # ---------- 4. 恢复 DL 编译缓存（缓存键绑定源码分支） ----------
    - name: 恢复 DL 源码包缓存
      uses: actions/cache@v4
      with:
        path: ${{ env.SRC_DIR }}/dl # 缓存 lede/dl 目录（已下载的软件包源码）
        key: lede-dl-${{ runner.os }}-${{ env.SOURCE_BRANCH }} # 缓存键：OS + 源码分支
        restore-keys: | # 未命中时回退到同分支/同 OS 的旧缓存
          lede-dl-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-
          lede-dl-${{ runner.os }}-

    # ---------- 5. 浅克隆 lean LEDE 源码（master） ----------
    - name: 克隆 lean LEDE 源码
      run: |
        # --depth=1 浅克隆，只取最新代码，减少耗时
        git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" "$SRC_DIR"
        echo "源码 commit: $(git -C "$SRC_DIR" rev-parse HEAD)"

    # ---------- 6. 第一步：同步官方 feeds 软件源 ----------
    - name: 更新并安装官方 feeds
      working-directory: ${{ env.SRC_DIR }}
      run: |
        ./scripts/feeds update -a # 同步全部官方软件源索引
        ./scripts/feeds install -a # 安装全部官方软件源包

    # ---------- 7. 第二步：拉取第三方软件源（浅克隆 + 前置校验） ----------
    - name: 拉取第三方软件源
      run: bash scripts/fetch_thirdparty.sh "$SRC_DIR"
      # kenzok8/openwrt-packages + kenzok8/small-package + mufeng05/turboacc
      # 浅克隆 --depth=1 --filter=tree:0，拉取前校验连通性/分支/目录/Makefile

    # ---------- 8. 第二步半：适配 add_turboacc.sh 的 lean 全架构内核版本矩阵 ----------
    - name: 适配 turboacc 脚本内核版本遍历
      run: bash scripts/patch_turboacc.sh "$SRC_DIR"
      # lean 源码 include/ 含 6.1/5.10/5.4/6.6/6.12/5.15/6.18 全架构版本矩阵，
      # 上游脚本遇不支持的版本会 exit 1；此处改为跳过非目标版本 + 兜底校验

    # ---------- 9. 第三步：集成独立插件 turboacc（内核补丁/全锥NAT） ----------
    - name: 集成 turboacc 组件
      working-directory: ${{ env.SRC_DIR }}
      run: bash package/turboacc/add_turboacc.sh
      # 自动识别源码树内核版本（6.18），打入 shortcut-fe/fullcone 补丁，
      # 安装 kmod-nft-fullcone（全锥形NAT）等组件，与编译内核严格匹配

    # ---------- 10. 清理第三方冲突插件与预编译内核模块 ----------
    - name: 清理冲突插件与预编译 kmod
      run: bash scripts/cleanup_conflicts.sh "$SRC_DIR"
      # 删除与官方 feeds 重复的包、第三方预编译 .ipk，避免依赖冲突

    # ---------- 11. 应用自定义系统参数（IP/密码/主机名/时区/主题） ----------
    - name: 应用自定义系统参数
      run: bash scripts/custom_settings.sh "$SRC_DIR"
      # 后台IP 192.168.2.1 / 密码 12345678 / 主机名 / Asia/Shanghai / Argon

    # ---------- 11. 写入编译配置并展开 ----------
    - name: 写入 x86_64 编译配置
      run: |
        cd "$SRC_DIR"
        make defconfig # 先生成 target 默认配置（保证 x86/64 目标正确）
        cat "../$CONFIG_FILE" >> .config # 追加自定义插件与内核配置
        make defconfig # 重新展开，合并去重

    # ---------- 12. 预下载全部软件包源码（命中 DL 缓存） ----------
    - name: 下载全部软件包源码
      working-directory: ${{ env.SRC_DIR }}
      run: make download -j"$(nproc)" # 多线程下载，缓存命中时极快

    # ---------- 13. 编译固件（严格模式：任意软件包报错立即终止） ----------
    - name: 编译固件
      working-directory: ${{ env.SRC_DIR }}
      shell: bash
      run: |
        set -o pipefail # 保证 make 经管道后失败码不丢失
        # 未使用 -k/--keep-going，任一软件包编译报错 make 立即停止，任务终止
        make -j"$(nproc)" V=s 2>&1 | tee build.log # 全程输出详细日志

    # ---------- 14. 编译失败自动上传完整日志 ----------
    - name: 上传编译失败日志
      if: failure() # 仅当前面步骤失败时执行
      uses: actions/upload-artifact@v4
      with:
        name: build-log # 日志工件名
        path: ${{ env.SRC_DIR }}/build.log # 完整编译日志
        retention-days: 7 # 保留 7 天
        if-no-files-found: warn # 日志缺失时警告不失败

    # ---------- 15. 校验镜像（分区容量/格式/squashfs 完整性，不达标终止） ----------
    - name: 校验镜像完整性与分区容量
      run: bash scripts/verify_image.sh "$SRC_DIR/bin/targets/x86/64"
      # 校验 rootfs 分区 >= 2GiB、镜像格式、squashfs 结构、gzip 完整性

    # ---------- 16. 打包时间戳固件并清理多余镜像 ----------
    - name: 打包时间戳固件
      run: bash scripts/package_firmware.sh "$SRC_DIR/bin/targets/x86/64" "$OUTPUT_DIR"
      # 产物命名 YYYYMMDD-HHMMSS-lede-x86_64-squashfs.img.gz
      # img.gz 未生成则判定编译失败直接退出（不会走到 Release）
      # 其余 bin 目录多余镜像（vdi/vmdk/efi 等）全部自动清理

    # ---------- 17. 生成 Release 说明（commit/内核版本/插件清单） ----------
    - name: 生成 Release 说明
      run: bash scripts/gen_release_notes.sh "$SRC_DIR" > release_notes.md

    # ---------- 18. 创建 Release 并上传固件压缩包 ----------
    - name: 创建 Release 并上传固件
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }} # Release 标签（时间戳）
        name: LEDE x86_64 ${{ env.RELEASE_TAG }} # Release 标题
        body_path: release_notes.md # 发布说明内容
        files: ${{ env.OUTPUT_DIR }}/*.img.gz # 上传固件压缩包
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 令牌写入权限
